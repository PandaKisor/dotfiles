[Greeter]
# Installed separately by scripts/login-screen.sh; independent of user caches.
background=/usr/local/share/backgrounds/dotfiles/login.svg
background-color=#0b1118
draw-user-backgrounds=false
draw-grid=false
stretch-background-across-monitors=false
theme-name=cachyos-nord
icon-theme-name=Pop
cursor-theme-name=capitaine-cursors
cursor-theme-size=24
font-name=Fira Sans 12
xft-antialias=true
xft-hintstyle=hintslight
enable-hidpi=auto
content-align=center
show-hostname=false
show-clock=true
clock-format=%a, %b %d  ·  %I:%M %p
show-keyboard=true
show-a11y=true
show-power=true
