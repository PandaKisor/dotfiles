# Minimal dark desktop: subtle transparency, slight rounded corners, soft shadows

# Animations
transition-length = 50
transition-pow-x = 0.1
transition-pow-y = 0.1
transition-pow-w = 0.1
transition-pow-h = 0.1
size-transition = true

# Corners
corner-radius = 10.0;
rounded-corners-exclude = [
  "class_g = 'Polybar'",
  "class_g = 'dwm'",
];
round-borders = 1;

# Shadows
shadow = true;
shadow-radius = 12;
shadow-opacity = 0.35;
shadow-offset-x = -5;
shadow-offset-y = -5;
shadow-exclude = [
  "class_g = 'Polybar'",
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "_GTK_FRAME_EXTENTS@:c"
];

# Fading
fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;
fade-exclude = [
  "class_g = 'slop'"
];

# Transparency / opacity
inactive-opacity = 0.96;
active-opacity = 1.0;
frame-opacity = 0.85;
inactive-opacity-override = false;
inactive-dim = 0.08;

popup_menu = { opacity = 0.92; }
dropdown_menu = { opacity = 0.92; }

focus-exclude = [
  "class_g = 'Polybar'",
  "class_g = 'slop'"
];

opacity-rule = [
  "100:class_g = 'Polybar'",
  "100:class_g = 'firefox'",
  "100:class_g = 'discord'",
  "100:class_g = 'Steam'",
  "100:class_g = 'steam'",
  "100:class_g = 'Thunar'",
  "100:class_g = 'Pavucontrol'"
];

# Blur. This matches the CachyOS picom style; comment this block if your picom build complains.
blur: {
  method = "dual_kawase";
  strength = 6;
  deviation = 0.0;
  kernel = "11x11gaussian";
  background = false;
  background-frame = false;
  background-fixed = false;
  kern = "3x3box";
}
blur-background-exclude = [
  "class_g = 'slop'",
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "_GTK_FRAME_EXTENTS@:c"
];

backend = "glx";
vsync = true;
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
unredir-if-possible = true;
detect-transient = true;
detect-client-leader = true;
use-damage = true;
log-level = "warn";

wintypes:
{
  normal = { fade = false; shadow = true; }
  tooltip = { fade = true; shadow = true; opacity = 0.90; focus = true; full-shadow = false; };
  dock = { shadow = false; }
  dnd = { shadow = false; }
  popup_menu = { opacity = 0.92; }
  dropdown_menu = { opacity = 0.92; }
};
