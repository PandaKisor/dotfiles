# VM profile: XRender avoids the physical host's OpenGL and blur pipeline.
backend = "xrender";
vsync = false;
use-damage = true;
unredir-if-possible = false;

corner-radius = 12;
rounded-corners-exclude = [ "window_type = 'dock'", "window_type = 'desktop'" ];
shadow = true;
shadow-radius = 12;
shadow-opacity = 0.42;
shadow-offset-x = -6;
shadow-offset-y = -6;
shadow-exclude = [ "window_type = 'dock'", "window_type = 'desktop'", "_GTK_FRAME_EXTENTS" ];

fading = false;
blur-method = "none";
inactive-opacity = 0.96;
active-opacity = 1.0;
frame-opacity = 0.85;
inactive-opacity-override = false;
detect-client-opacity = true;
opacity-rule = [
  "96:class_g = 'Polybar'",
  "100:class_g = 'firefox'",
  "100:class_g = 'discord'",
  "100:class_g = 'Steam'",
  "100:class_g = 'steam'",
  "100:class_g = 'Thunar'",
  "100:class_g = 'Pavucontrol'"
];
log-level = "warn";
