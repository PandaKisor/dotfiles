local palette = {
    background = '#0B1118',
    foreground = '#D8DEE9',
    color4 = '#5E81AC',
    color5 = '#B48EAD',
    color6 = '#88C0D0',
    color8 = '#4C566A',
}

local cache_home = os.getenv('XDG_CACHE_HOME')
if not cache_home or cache_home == '' then
    cache_home = (os.getenv('HOME') or '') .. '/.cache'
end

local palette_file = io.open(cache_home .. '/wal/colors.sh', 'r')
if palette_file then
    for line in palette_file:lines() do
        local key, value = line:match("^([%w_]+)='(#[%x]+)'$")
        if key and palette[key] and value:match('^#%x%x%x%x%x%x$') then
            palette[key] = value
        end
    end
    palette_file:close()
end

-- Current Conky accepts alpha in own_window_colour as #AARRGGBB. Keeping the
-- opacity beside the selected background avoids its deprecated ARGB switches.
local window_background = '#E6' .. palette.background:sub(2)

conky.config = {
    alignment = 'top_left',
    background = false,
    border_inner_margin = 24,
    cpu_avg_samples = 2,
    default_color = palette.foreground,
    color1 = palette.color4,
    color2 = palette.color5,
    color3 = palette.color6,
    color4 = palette.color8,
    double_buffer = true,
    draw_borders = false,
    draw_graph_borders = false,
    draw_outline = false,
    draw_shades = false,
    extra_newline = false,
    font = 'MesloLGS Nerd Font Mono:size=11',
