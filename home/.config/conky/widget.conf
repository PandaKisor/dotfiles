    minimum_height = 360,
    minimum_width = 420,
    net_avg_samples = 2,
    no_buffers = true,
    out_to_console = false,
    out_to_stderr = false,
    out_to_x = true,
    own_window = true,
    own_window_class = 'i3-widget-system',
    own_window_colour = window_background,
    own_window_hints = 'skip_taskbar,skip_pager',
    own_window_title = 'System • Overview',
    own_window_type = 'normal',
    show_graph_range = false,
