set $pywal_background     {background}
set $pywal_foreground     {foreground}
set $pywal_foreground_alt {color7}
set $pywal_muted          {color8}
set $pywal_focus          {color4.lighten(20%)}
set $pywal_alert          #BF616A

# Variables defined in an included file must also be consumed in that file.
# These later client directives replace the static fallbacks in the parent.
# class                 border  backgr. text    indicator child_border
client.focused          $pywal_focus      $pywal_background $pywal_foreground     $pywal_focus      $pywal_focus
client.focused_inactive $pywal_background $pywal_background $pywal_foreground_alt $pywal_background $pywal_background
client.unfocused        $pywal_background $pywal_background $pywal_muted          $pywal_background $pywal_background
client.urgent           $pywal_alert      $pywal_alert      $pywal_background     $pywal_alert      $pywal_alert
client.placeholder      $pywal_background $pywal_background $pywal_foreground     $pywal_background $pywal_background
client.background       $pywal_background
