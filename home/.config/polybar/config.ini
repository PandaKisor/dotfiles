; Floating wallpaper-aware Polybar
; Workspaces | active window                         system status | date

; Include paths are expanded before Polybar's ${env:...} references are
; available, so this must use shell-style environment expansion.
include-file = $POLYBAR_THEME_FILE

[bar/example]
monitor = ${env:MONITOR:}
width = 100%
offset-x = 0
offset-y = 8
height = 34
radius = 10
fixed-center = true
top = yes
bottom = no
override-redirect = false

foreground = ${colors.foreground}
background = ${colors.background}

line-size = 2
line-color = ${colors.accent}

border-size = 1
border-color = ${colors.accent}
padding-left = 2
padding-right = 2
module-margin-left = 0
module-margin-right = 0

font-0 = MesloLGS Nerd Font Mono:pixelsize=11;3
font-1 = Fira Sans:pixelsize=10;3

modules-left = i3
modules-center = xwindow
modules-right = media cpu memory network volume date notifications control

scroll-up = #i3.next
scroll-down = #i3.prev
cursor-click = pointer
cursor-scroll = ns-resize

[module/i3]
type = internal/i3
format = <label-state> <label-mode>
index-sort = true
wrapping-scroll = false
strip-wsnumbers = false
enable-click = true
enable-scroll = false

label-mode = %mode%
label-mode-foreground = ${colors.background}
label-mode-background = ${colors.accent}
label-mode-padding = 2

; A compact circular marker replaces the wide, square selection block.
label-focused =  %index%
label-focused-foreground = ${colors.accent}
label-focused-background = ${colors.background}
label-focused-padding = 0

label-unfocused = %index%
label-unfocused-foreground = ${colors.foreground-alt}
label-unfocused-background = ${colors.background}
label-unfocused-padding = 1

label-visible = %index%
label-visible-foreground = ${colors.foreground}
label-visible-background = ${colors.background-alt}
label-visible-underline = ${colors.accent}
label-visible-padding = 1

label-urgent =  %index%
label-urgent-foreground = ${colors.alert}
label-urgent-background = ${colors.background}
label-urgent-padding = 0

label-separator =
label-separator-padding = 0

[module/xwindow]
type = internal/xwindow
label =   %title%
label-maxlen = 58
label-empty = Desktop
label-foreground = ${colors.foreground-alt}
label-padding = 1

[module/media]
type = custom/script
exec = ~/.config/polybar/scripts/media-status.sh
interval = 2
format = <label>
format-padding = 1
label = %output%
label-maxlen = 42
label-foreground = ${colors.accent-strong}
click-left = playerctl --player=playerctld play-pause
click-middle = playerctl --player=playerctld previous
click-right = playerctl --player=playerctld next
scroll-up = playerctl --player=playerctld volume 0.05+
scroll-down = playerctl --player=playerctld volume 0.05-

[module/cpu]
type = internal/cpu
interval = 2
format = <label>
format-padding = 1
label =   %percentage%%
label-foreground = ${colors.foreground}
label-background = ${colors.background}

[module/memory]
type = internal/memory
interval = 3
format = <label>
format-padding = 1
label =   %percentage_used%%
label-foreground = ${colors.foreground}
label-background = ${colors.background}

[module/network]
type = internal/network
interface = ${env:POLYBAR_NETWORK_INTERFACE:}
interval = 3.0

format-connected = <label-connected>
format-connected-padding = 1
label-connected =   %local_ip%
label-connected-foreground = ${colors.foreground}
label-connected-background = ${colors.background}

format-disconnected = <label-disconnected>
format-disconnected-padding = 1
label-disconnected =   down
label-disconnected-foreground = ${colors.muted}
label-disconnected-background = ${colors.background}

[module/volume]
type = internal/pulseaudio

click-left = ~/.config/i3/volume-osd.sh mute
click-right = pavucontrol
click-middle = ~/.config/i3/volume-osd.sh mute
scroll-up = ~/.config/i3/volume-osd.sh up
scroll-down = ~/.config/i3/volume-osd.sh down

format-volume = <label-volume>
format-volume-padding = 1
label-volume =   %percentage%%
label-volume-foreground = ${colors.foreground}
label-volume-background = ${colors.background}

format-muted = <label-muted>
format-muted-padding = 1
label-muted =   muted
label-muted-foreground = ${colors.alert}
label-muted-background = ${colors.background}

[module/date]
type = internal/date
interval = 1
time = %a %d  %I:%M %p
format = <label>
format-padding = 1
label =   %time%
label-foreground = ${colors.accent-strong}
label-background = ${colors.background}

[module/control]
type = custom/text
format = 
format-padding = 1
format-foreground = ${colors.accent}
click-left = ~/.config/i3/control-center.sh

[module/notifications]
type = custom/script
exec = ~/.config/polybar/scripts/notification-status.sh
interval = 2
format = <label>
format-padding = 1
label = %output%
label-foreground = ${colors.accent}
click-left = ~/.config/i3/notification-center.sh
click-middle = dunstctl set-paused toggle
click-right = dunstctl close-all

[settings]
screenchange-reload = true
pseudo-transparency = false

[global/wm]
margin-top = 0
margin-bottom = 0
