; Minimal wallpaper-aware Polybar
; Top bar, lean density: workspaces | CPU | RAM      NET | VOL | date

; Include paths are expanded before Polybar's ${env:...} references are
; available, so this must use shell-style environment expansion.
include-file = $POLYBAR_THEME_FILE

[bar/example]
monitor = ${env:MONITOR:}
width = 100%
offset-x = 0
offset-y = 0
height = 27
radius = 0
fixed-center = true
top = yes
bottom = no
override-redirect = false

foreground = ${colors.foreground}
background = ${colors.background}

line-size = 2
line-color = ${colors.accent}

border-size = 0
padding-left = 1
padding-right = 0
module-margin-left = 0
module-margin-right = 0

font-0 = Hack:pixelsize=10;3
font-1 = monospace:pixelsize=10;3

modules-left = i3 sp2 cpu sp2 memory
modules-center =
modules-right = network sp1 volume sp1 date

wm-restack = i3
scroll-up = #i3.next
scroll-down = #i3.prev
cursor-click = pointer
cursor-scroll = ns-resize

[module/sp1]
type = custom/text
format = " | "
format-foreground = ${colors.muted}
format-background = ${colors.background}

[module/sp2]
type = custom/text
format = "  |  "
format-foreground = ${colors.muted}
format-background = ${colors.background}

[module/i3]
type = internal/i3
format = <label-state> <label-mode>
index-sort = true
wrapping-scroll = false
strip-wsnumbers = false
enable-click = true
enable-scroll = false

label-mode = %mode%
label-mode-padding = 1
label-mode-foreground = ${colors.background}
label-mode-background = ${colors.accent}

label-focused = %index%
label-focused-foreground = ${colors.background}
label-focused-background = ${colors.accent}
label-focused-padding = 1

label-unfocused = %index%
label-unfocused-foreground = ${colors.foreground-alt}
label-unfocused-background = ${colors.background}
label-unfocused-padding = 1

label-visible = %index%
label-visible-foreground = ${colors.foreground}
label-visible-background = ${colors.background-alt}
label-visible-underline = ${colors.accent}
label-visible-padding = 1

label-urgent = %index%
label-urgent-foreground = ${colors.background}
label-urgent-background = ${colors.alert}
label-urgent-padding = 1

label-separator =
label-separator-padding = 0

[module/cpu]
type = internal/cpu
interval = 2
format = <label>
label = CPU %percentage%%
label-foreground = ${colors.foreground}
label-background = ${colors.background}

[module/memory]
type = internal/memory
interval = 3
format = <label>
label = RAM %percentage_used%%
label-foreground = ${colors.foreground}
label-background = ${colors.background}

[module/network]
type = internal/network
interface = ${env:POLYBAR_NETWORK_INTERFACE:}
interval = 3.0

format-connected = <label-connected>
label-connected = NET %local_ip%
label-connected-foreground = ${colors.foreground}
label-connected-background = ${colors.background}

format-disconnected = <label-disconnected>
label-disconnected = NET down
label-disconnected-foreground = ${colors.muted}
label-disconnected-background = ${colors.background}

[module/volume]
type = internal/pulseaudio

click-left = pactl set-sink-mute @DEFAULT_SINK@ toggle
click-right = pavucontrol
click-middle = pactl set-sink-mute @DEFAULT_SINK@ toggle
scroll-up = pactl set-sink-volume @DEFAULT_SINK@ +5%
scroll-down = pactl set-sink-volume @DEFAULT_SINK@ -5%

format-volume = <label-volume>
label-volume = VOL %percentage%%
label-volume-foreground = ${colors.foreground}
label-volume-background = ${colors.background}

format-muted = <label-muted>
label-muted = MUTED
label-muted-foreground = ${colors.alert}
label-muted-background = ${colors.background}

[module/date]
type = internal/date
interval = 1
time = %a %d  %I:%M %p
format = <label>
label = %time%
label-foreground = ${colors.foreground-alt}
label-background = ${colors.background}

[settings]
screenchange-reload = true
pseudo-transparency = false

[global/wm]
margin-top = 0
margin-bottom = 0
